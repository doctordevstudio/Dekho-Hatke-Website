<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Video - Dekho Hatke</title>
    <!-- Load HLS.js for decoding .m3u8 streams -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f0f0f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: white;
        }
        .player-container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            box-sizing: border-box;
        }
        video {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            background: #000;
            aspect-ratio: 16 / 9;
        }
        #error-message {
            display: none;
            text-align: center;
            color: #ff4d4d;
            font-size: 1.2rem;
            padding: 20px;
            background: rgba(255, 77, 77, 0.1);
            border: 1px solid #ff4d4d;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <div id="error-message">❌ No video source provided or the link is invalid.</div>
        <video id="video-player" controls crossorigin="anonymous" playsinline></video>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Extract the '?src=' parameter from the browser URL
            const urlParams = new URLSearchParams(window.location.search);
            const videoSrc = urlParams.get('src');
            
            const video = document.getElementById('video-player');
            const errorMessage = document.getElementById('error-message');

            // 2. Error handling if someone visits /play directly without a link
            if (!videoSrc) {
                video.style.display = 'none';
                errorMessage.style.display = 'block';
                return;
            }

            // 3. Play HLS (.m3u8) streams for Faphouse
            if (videoSrc.includes('.m3u8')) {
                if (Hls.isSupported()) {
                    const hls = new Hls({
                        maxBufferLength: 30,
                        enableWorker: true
                    });
                    hls.loadSource(videoSrc);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        video.play().catch(e => console.log("Autoplay blocked by browser."));
                    });
                } 
                // Native HLS support (Safari / iOS)
                else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = videoSrc;
                    video.addEventListener('loadedmetadata', function() {
                        video.play().catch(e => console.log("Autoplay blocked by browser."));
                    });
                }
            } 
            // 4. Play standard MP4/direct formats for Terabox
            else {
                video.src = videoSrc;
                video.play().catch(e => console.log("Autoplay blocked by browser."));
            }
        });
    </script>
</body>
</html>
